mestre-bimba:
  name: Mestre Bimba
  kind: mestre
  aka: [Manuel dos Reis Machado]
  lived: 1899–1974
  description: Creator of Capoeira Regional and founder of the first capoeira academy recognised in Brazil (Salvador, 1930s).
mestre-pastinha:
  name: Mestre Pastinha
  kind: mestre
  aka: [Vicente Ferreira Pastinha]
  lived: 1889–1981
  description: The great guardian of Capoeira Angola, founder of the Centro Esportivo de Capoeira Angola in Salvador.
besouro-manganga:
  name: Besouro Mangangá
  kind: legendary
  aka: [Besouro Cordão de Ouro, Manoel Henrique Pereira]
  lived: c. 1895–1924
  description: Legendary capoeirista from Santo Amaro, said to have a "corpo fechado" — a body that bullets and blades could not harm.
lampiao:
  name: Lampião
  kind: historical
  aka: [Virgulino Ferreira da Silva]
  lived: c. 1897–1938
  description: The most famous cangaceiro (bandit) of the Brazilian northeastern backlands.
zumbi-dos-palmares:
  name: Zumbi dos Palmares
  kind: historical
  lived: 1655–1695
  description: Leader of the Quilombo dos Palmares and a symbol of Black resistance in Brazil.
oxala:
  name: Oxalá
  kind: religious
  description: The orixá of creation and peace in Candomblé, associated with white and with Jesus/Senhor do Bonfim in Bahia.
santo-antonio:
  name: Santo Antônio
  kind: religious
  description: Saint Anthony, a much-loved popular saint in Brazil, celebrated in the June festivals.
iemanja:
  name: Iemanjá
  kind: religious
  description: The orixá of the sea, mother of the waters, honoured in Salvador every 2 February.
xango:
  name: Xangô
  kind: religious
  description: The orixá of thunder, fire and justice.
sao-bento:
  name: São Bento
  kind: religious
  description: Saint Benedict — protector against snakes and evil.
sao-joao:
  name: São João
  kind: religious
  description: Saint John the Baptist, celebrated with bonfires in the June festivals (festas juninas).
oxum:
  name: Oxum
  kind: religious
  description: The orixá of fresh water, rivers, gold and love, associated with yellow.
