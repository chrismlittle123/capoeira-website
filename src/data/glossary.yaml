axe:
  term: Axé
  definition: Life force, positive energy — the good vibration of the roda. Also used as a greeting or blessing.
camara:
  term: Camará
  forms: [camarada]
  definition: Comrade, friend. The response sung in the louvação, from "camarada".
roda:
  term: Roda
  forms: [rodas]
  definition: The circle of people, music and singing in which capoeira is played.
ie:
  term: Iê
  definition: The call that opens a ladainha or stops the game — the berimbau's voice made human.
mandinga:
  term: Mandinga
  definition: Magic, cunning and charm in the game; the hidden, mystical side of capoeira.
malicia:
  term: Malícia
  definition: Craftiness — reading your opponent and deceiving them with a smile.
volta-do-mundo:
  term: Volta do mundo
  definition: “The world goes round” — walking around the roda during a pause in the game; also a reminder that life turns.
jogo:
  term: Jogo
  definition: The game — capoeira is not "fought", it is played.
mestre:
  term: Mestre
  forms: [mestres]
  definition: Master; the highest title of a capoeira teacher.
berimbau:
  term: Berimbau
  forms: [berimbaus]
  definition: The musical bow with a gourd resonator that leads the roda and sets the game.
aide:
  term: Aidê
  definition: A woman's name in song; in one popular story, an enslaved woman who refused her master and escaped to the quilombo.
lampiao:
  term: Lampião
  definition: Nickname (literally "lantern") of the famous cangaceiro Virgulino Ferreira da Silva.
marinheiro:
  term: Marinheiro
  definition: Sailor.
paranaue:
  term: Paranauê
  definition: A sung exclamation built on "Paraná" — the great river on Brazil's border with Paraguay and Argentina.
viola:
  term: Viola
  definition: The highest-pitched of the three berimbaus (gunga, médio, viola), which improvises over the others. Also a name for a guitar.
gunga:
  term: Gunga
  definition: The deepest berimbau, played by whoever leads the roda.
vadiar:
  term: Vadiar
  forms: [vadiação, vadiando]
  definition: To loaf, to play around — the old word for playing capoeira, from the days when capoeiristas were called "vadios" (idlers).
atabaque:
  term: Atabaque
  forms: [atabaques]
  definition: The tall hand drum of the bateria.
pandeiro:
  term: Pandeiro
  forms: [pandeiros]
  definition: The Brazilian frame drum with jingles.
agogo:
  term: Agogô
  definition: A double bell struck with a stick.
reco-reco:
  term: Reco-reco
  definition: A scraper — a notched piece of bamboo or wood rubbed with a stick.
ioio:
  term: Ioiô
  definition: Old Bahian form of address for a young master or gentleman (from "senhor"); in songs often just part of the refrain, paired with iaiá.
iaia:
  term: Iaiá
  definition: Old Bahian form of address for a young mistress or lady (from "sinhá"); the partner of ioiô in many refrains.
terreiro:
  term: Terreiro
  forms: [terreiros]
  definition: A yard or open ground — and the sacred space of a Candomblé house.
patua:
  term: Patuá
  definition: A small protective amulet, often a cloth pouch worn around the neck.
angoleiro:
  term: Angoleiro
  forms: [angoleira, angoleiros]
  definition: A player of Capoeira Angola.
dende:
  term: Dendê
  definition: Palm oil, the red oil of Bahian cooking — and in capoeira, the spice, flavour and swing a player brings to the game ("ter dendê").
