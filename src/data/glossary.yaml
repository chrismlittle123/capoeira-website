axe:
  term: Axé
  definition: Life force, positive energy — the good vibration of the roda. Also used as a greeting or blessing.
camara:
  term: Camará
  forms: [camarada]
  definition: Comrade, friend. The response sung in the louvação, from "camarada".
roda:
  term: Roda
  forms: [rodas]
  definition: The circle of people, music and singing in which capoeira is played.
ie:
  term: Iê
  definition: The call that opens a ladainha or stops the game — the berimbau's voice made human.
mandinga:
  term: Mandinga
  definition: Magic, cunning and charm in the game; the hidden, mystical side of capoeira.
malicia:
  term: Malícia
  definition: Craftiness — reading your opponent and deceiving them with a smile.
volta-do-mundo:
  term: Volta do mundo
  definition: “The world goes round” — walking around the roda during a pause in the game; also a reminder that life turns.
jogo:
  term: Jogo
  definition: The game — capoeira is not "fought", it is played.
mestre:
  term: Mestre
  forms: [mestres]
  definition: Master; the highest title of a capoeira teacher.
berimbau:
  term: Berimbau
  forms: [berimbaus]
  definition: The musical bow with a gourd resonator that leads the roda and sets the game.
aide:
  term: Aidê
  definition: A woman's name in song; in one popular story, an enslaved woman who refused her master and escaped to the quilombo.
lampiao:
  term: Lampião
  definition: Nickname (literally "lantern") of the famous cangaceiro Virgulino Ferreira da Silva.
marinheiro:
  term: Marinheiro
  definition: Sailor.
paranaue:
  term: Paranauê
  definition: A sung exclamation built on "Paraná" — the great river on Brazil's border with Paraguay and Argentina.
